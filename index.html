<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Home</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="script.js"></script>

    <!--link de icon-->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=currency_exchange"
    />
  </head>
  <body>
    <div class="converter-card">
      <h1>
        Conversor de Moedas
        <span class="material-symbols-outlined"> currency_exchange </span>
      </h1>

      <h5>Esse é um conversor de moedas de Metical para Dollar</h5>

      <div class="input-group">
        <label for="mzn">Meticais (MZN)</label>
        <input
          type="number"
          id="mzn"
          placeholder="Digite o valor em Meticais"
          step="any"
        />
      </div>
      <div class="input-group">
        <label for="mzn">Dollar (USD)</label>
        <input
          type="number"
          id="usd"
          placeholder="Digite o valor em Dollares"
          step="any"
        />
      </div>
      <footer>Criado por Djane Bucar &copy; 2026</footer>
    </div>
  </body>
</html>
